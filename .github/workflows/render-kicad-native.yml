name: KiCad native 3D render
on:
  push:
    branches: [render-kicad-temp]
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --install-recommends kicad xvfb
          kicad-cli version
      - name: Check local 3D models
        run: |
          echo "STEP files:"
          find composants/3d -maxdepth 1 -iname '*.step' -printf '%f\n' | sort
          echo "Count: $(find composants/3d -maxdepth 1 -iname '*.step' | wc -l)"
          grep -o '\${KIPRJMOD}/composants/3d/[^"]*' H743_Ardupilot.kicad_pcb | sort -u
      - name: Native KiCad raytraced renders
        run: |
          mkdir -p render
          xvfb-run -a kicad-cli pcb render H743_Ardupilot.kicad_pcb -o render/FC_01_TOP_ISO.png \
            --width 2400 --height 1800 --side top --background opaque --quality high --floor --perspective \
            --rotate=-45,0,45 --zoom 1
          xvfb-run -a kicad-cli pcb render H743_Ardupilot.kicad_pcb -o render/FC_01_BOTTOM_ISO.png \
            --width 2400 --height 1800 --side bottom --background opaque --quality high --floor --perspective \
            --rotate=45,0,-45 --zoom 1
          xvfb-run -a kicad-cli pcb render H743_Ardupilot.kicad_pcb -o render/FC_01_TOP.png \
            --width 2400 --height 1800 --side top --background opaque --quality high --zoom 1
          xvfb-run -a kicad-cli pcb render H743_Ardupilot.kicad_pcb -o render/FC_01_BOTTOM.png \
            --width 2400 --height 1800 --side bottom --background opaque --quality high --zoom 1
          file render/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: FC_01-KiCad-native-3D
          path: render/*.png
          if-no-files-found: error
