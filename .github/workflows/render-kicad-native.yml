name: Export official KiCad USB STEP
on:
  push:
    branches: [render-kicad-temp]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --install-recommends kicad
          kicad-cli version
      - name: Export exact JAE model
        run: |
          set -eux
          SRC=/usr/share/kicad/3dmodels/Connector_USB.3dshapes/USB_C_Receptacle_JAE_DX07S016JA1R1500.step
          test -f "$SRC"
          mkdir -p official-step
          cp "$SRC" official-step/USB_C_Receptacle_JAE_DX07S016JA1R1500.step
          wc -c official-step/*.step
          head -20 official-step/*.step
      - uses: actions/upload-artifact@v4
        with:
          name: official-JAE-DX07S016JA1R1500-step
          path: official-step/*.step
          if-no-files-found: error
